name: backup-telebot

x-service: &service
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
    DATA_DIR: /data/runtime/data
    TELEGRAM_SESSION_PATH: /data/runtime/telegram/bot.session
    TELEGRAM_WORKER_SESSION_PATH: /data/runtime/telegram/worker.session
    WORK_ROOT: /data/runtime/work
    PENDING_DELIVERY_ROOT: /data/runtime/pending-delivery
    LOCAL_SOURCE_MOUNTS: ${LOCAL_SOURCE_MOUNTS:-}
    GITLAB_HELPER_SOCKET: /run/gitlab-helper/helper.sock
    GITLAB_LOCAL_BACKUP_PATH: /gitlab-backups
    GITLAB_STAGING_ROOT: /data/gitlab-staging
  restart: unless-stopped
  init: true
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  mem_limit: ${CONTAINER_MEMORY_LIMIT:-2g}
  cpus: ${CONTAINER_CPU_LIMIT:-2.0}
  pids_limit: 256
  tmpfs: ["/tmp:mode=0700,uid=10001,gid=10001"]
  volumes:
    - type: bind
      source: ./.runtime
      target: /data/runtime
      bind:
        create_host_path: false
  healthcheck:
    test: ["CMD", "backupctl", "healthcheck"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 20s

services:
  postgres:
    image: postgres:18-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256
    volumes:
      - postgres_data_v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username \"$$POSTGRES_USER\" --dbname \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt: ["no-new-privileges:true"]
    shm_size: 128mb
    stop_grace_period: 60s

  migrate:
    <<: *service
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    command: ["alembic", "upgrade", "head"]

  bot:
    <<: *service
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["backup-bot"]

  worker:
    <<: *service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["backup-worker"]
    volumes:
      - type: bind
        source: ./.runtime
        target: /data/runtime
        bind:
          create_host_path: false
      - gitlab_helper_control:/run/gitlab-helper
      - gitlab_staging:/data/gitlab-staging
      # ---------------------------------------------------------------------------
      # Local File / Directory Backup
      # Uncomment and edit this bind mount when the worker must back up files
      # directly from this Docker host. The left side is the host filesystem path;
      # the right side is the path visible inside the worker. Keep this mapping in
      # sync with ALLOWED_SOURCE_ROOTS and LOCAL_SOURCE_MOUNTS.
      #
      # Host path                 Worker-visible path
      # /etc                      /host/etc
      #
      # - /etc:/host/etc:ro

  gitlab-helper:
    build: .
    profiles: ["local-gitlab"]
    command: ["backup-gitlab-helper"]
    environment:
      GITLAB_HELPER_SOCKET: /run/gitlab-helper/helper.sock
      GITLAB_BACKUP_ROOT: /gitlab-backups
      GITLAB_STAGING_ROOT: /data/gitlab-staging
      GITLAB_STABILITY_INTERVAL_SECONDS: ${GITLAB_STABILITY_INTERVAL_SECONDS:-1}
      GITLAB_STABILITY_CHECKS: ${GITLAB_STABILITY_CHECKS:-2}
    user: "0:0"
    restart: unless-stopped
    init: true
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # The helper alone gets the minimum filesystem capabilities needed to read and
    # remove GitLab-owned mode-0700 artifacts and hand ownership to UID/GID 10001.
    cap_add: ["CHOWN", "DAC_OVERRIDE"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    tmpfs: ["/tmp:mode=0700,uid=10001,gid=10001"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gitlab_helper_control:/run/gitlab-helper
      # Configure the host side of this one bind for the local GitLab installation.
      # No matching bind is needed on bot or worker, and no ACL/chmod is required.
      - ${GITLAB_BACKUP_HOST_PATH:-/opt/gitlab/data/backups}:/gitlab-backups
      - gitlab_staging:/data/gitlab-staging

  cli:
    <<: *service
    profiles: ["tools"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    command: ["backupctl", "--help"]

volumes:
  postgres_data_v18:
  gitlab_helper_control:
  gitlab_staging:
