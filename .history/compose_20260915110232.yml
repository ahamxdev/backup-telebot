name: backup-telebot

x-service: &service
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
    DATA_DIR: /data/runtime/data
    TELEGRAM_SESSION_PATH: /data/runtime/telegram/bot.session
    TELEGRAM_WORKER_SESSION_PATH: /data/runtime/telegram/worker.session
    WORK_ROOT: /data/runtime/work
    PENDING_DELIVERY_ROOT: /data/runtime/pending-delivery
  restart: unless-stopped
  init: true
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  mem_limit: ${CONTAINER_MEMORY_LIMIT:-2g}
  cpus: ${CONTAINER_CPU_LIMIT:-2.0}
  pids_limit: 256
  tmpfs: ["/tmp:mode=0700,uid=10001,gid=10001"]
  volumes:
    - type: bind
      source: ./.runtime
      target: /data/runtime
      bind:
        create_host_path: false- /etc:/host/etc:ro
  healthcheck:
    test: ["CMD", "backupctl", "healthcheck"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 20s

services:
  postgres:
    image: postgres:18-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256
    volumes:
      - postgres_data_v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username \"$$POSTGRES_USER\" --dbname \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt: ["no-new-privileges:true"]
    shm_size: 128mb
    stop_grace_period: 60s

  migrate:
    <<: *service
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    command: ["alembic", "upgrade", "head"]
  bot:
    <<: *service
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["backup-bot"]
  worker:
    <<: *service
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["backup-worker"]

  cli:
    <<: *service
    profiles: ["tools"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    command: ["backupctl", "--help"]

volumes:
  postgres_data_v18:
